# goreleaser configuration for EnvGuardian.
# Schema reference: https://goreleaser.com/customization/
version: 2

project_name: envguardian

metadata:
  mod_timestamp: "{{ .CommitTimestamp }}"

before:
  hooks:
    - go mod tidy -diff

builds:
  - id: envguardian
    main: ./cmd/envguardian
    binary: envguardian
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    # Injected into the vars declared in cmd/envguardian/main.go.
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.date={{ .Date }}

archives:
  - id: default
    formats: [tar.gz]
    # Windows users expect a zip.
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: checksums.txt

snapshot:
  # v0.1.1 was intentionally skipped after the v0.2 feature set landed.
  # Once v0.2.0 exists, ordinary snapshots resume patch increments.
  version_template: >-
    {{ if eq .Version "0.1.0" }}0.2.0-snapshot{{ else }}{{ incpatch .Version }}-snapshot{{ end }}

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

homebrew_casks:
  - name: envguardian
    ids:
      - default
    binaries:
      - envguardian
    homepage: "https://github.com/YehiaGewily/EnvGuardian"
    description: "Safely share age-encrypted dotenv configuration through Git"
    repository:
      owner: YehiaGewily
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    commit_author:
      name: goreleaserbot
      email: actions@github.com

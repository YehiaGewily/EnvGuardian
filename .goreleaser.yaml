# goreleaser configuration for EnvGuardian.
# Schema reference: https://goreleaser.com/customization/
version: 2

project_name: envguardian

before:
  hooks:
    - go mod tidy

builds:
  - id: envguardian
    main: ./cmd/envguardian
    binary: envguardian
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    # Injected into the vars declared in cmd/envguardian/main.go.
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.date={{ .Date }}

archives:
  - id: default
    formats: [tar.gz]
    # Windows users expect a zip.
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

# Homebrew tap (cask). Requires the tap repo YehiaGewily/homebrew-tap to exist
# and a token with write access to it (via GITHUB_TOKEN or `brews`/`homebrew`
# token) at release time.
homebrew_casks:
  - name: envguardian
    repository:
      owner: YehiaGewily
      name: homebrew-tap
      # A PAT with write access to the tap repo (the default GITHUB_TOKEN can't
      # push to another repo). See docs/RELEASING.md.
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://github.com/YehiaGewily/envguardian
    description: Commit your team's .env to git, encrypted.
    # macOS gatekeeper quarantines unsigned binaries; strip the attribute.
    hooks:
      post:
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/envguardian"]
          end
